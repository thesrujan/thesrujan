apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: quick-commerce
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: quick-commerce
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: Quick Commerce
        orgId: 1
        folder: Quick Commerce
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
